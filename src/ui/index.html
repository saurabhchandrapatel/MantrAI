    <div id="app">
        <div id="search-container" class="search-container">
            <div class="search-box">
                <div class="search-label">
                    <span class="label-text">Describe what you want the AI agent to do...</span>
                </div>
                
                <div class="search-input-container">
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="Ask something, or switch to Apps..."
                        autocomplete="off"
                    />
                    <button id="search-btn" class="search-btn">⏎</button>
                    <div id="suggestions" class="suggestions-container"></div>
                </div>

                <div class="bottom-options">
                    <div class="option-row">
                        <button id="agent-btn" class="option-btn active">Agent</button>
                        <button id="apps-btn" class="option-btn">Apps</button>
                        <button id="file-upload-btn" class="option-btn">
                            Upload File
                        </button>
                        <input type="file" id="file-input" class="hidden" />
                        <div class="settings-icon">
                            <button id="settings-btn" class="option-btn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                    <circle cx="12" cy="12" r="3"></circle>
                                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                                </svg>
                                
                            </button>
                            
                        </div>
                    </div>
                </div>
                <div id="loading" class="loading hidden">
                    <div class="spinner"></div>
                    <span>Processing...</span>
                </div>
                <div id="results-container" class="results-container hidden">
                    <div id="results-content" class="results-content"></div>
                    <div class="results-actions">
                        <button id="close-btn" class="action-btn">Close</button>
                        <button id="copy-btn" class="action-btn">Copy</button>
                        <button id="capture-context-btn" class="search-btn" title="Capture Context">Context</button>
                    </div>
                </div>
                
                <div id="context-container" class="context-container hidden">
                    <div class="context-header">
                        <span>📝 Context</span>
                        <button id="clear-context-btn" class="clear-context-btn">Clear</button>
                    </div>
                    <div id="context-content" class="context-content"></div>
                </div>
            </div>
        </div>
    </div> 
    <script src="renderer.js"></script>
</body>
