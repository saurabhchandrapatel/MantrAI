<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating AI Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <div id="search-container" class="search-container">
            <div class="search-box">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Ask me anything or type 'report' for productivity insights..."
                    autocomplete="off"
                >
                <button id="search-btn" class="search-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
               
            </div>
        </div>

        <div id="context-container" class="context-container hidden">
            <div class="context-header">
                <span>📝 Context</span>
                <button id="clear-context-btn" class="clear-context-btn">Clear</button>
            </div>
            <div id="context-content" class="context-content"></div>
        </div>


        <div id="results-container" class="results-container hidden">
            <div id="results-content" class="results-content"></div>
            <div class="results-actions">
                <button id="close-btn" class="action-btn">Close</button>
                <button id="copy-btn" class="action-btn">Copy</button>
                <button id="capture-context-btn" class="search-btn" title="Capture Context">Context</button>
            
            </div>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <span>Processing...</span>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
