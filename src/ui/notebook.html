<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Notebook Mode</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            background: #1E1E1E;
            color: #FFFFFF;
        }

        /* Left Sidebar: Files */
        .sidebar-left {
            width: 250px;
            background: #252526;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .sidebar-header {
            font-size: 14px;
            font-weight: 600;
            color: #CCCCCC;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .add-file-btn {
            background: #007ACC;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .add-file-btn:hover {
            background: #005a9e;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .file-item {
            padding: 8px 10px;
            background: #2D2D2D;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #CCCCCC;
            transition: background 0.2s;
        }

        .file-item:hover {
            background: #37373D;
        }

        .file-item.active {
            background: #37373D;
            border-left: 3px solid #007ACC;
        }

        .file-icon {
            font-size: 16px;
        }

        .file-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Center: Chat */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1E1E1E;
            position: relative;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.user {
            align-self: flex-end;
            background: #007ACC;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.ai {
            align-self: flex-start;
            background: #2D2D2D;
            color: #E0E0E0;
            border-bottom-left-radius: 2px;
        }

        .input-area {
            padding: 20px;
            background: #252526;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            background: #3C3C3C;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px;
            color: white;
            font-family: inherit;
            resize: none;
            height: 50px;
        }

        .chat-input:focus {
            outline: 1px solid #007ACC;
        }

        .send-btn {
            width: 50px;
            height: 50px;
            background: #007ACC;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            background: #005a9e;
        }

        /* Right Sidebar: Actions */
        .sidebar-right {
            width: 280px;
            background: #252526;
            border-left: 1px solid #333;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .action-card {
            background: #2D2D2D;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .action-title {
            font-size: 13px;
            font-weight: 600;
            color: #CCCCCC;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .suggestion-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: transparent;
            border: 1px solid #3E3E42;
            color: #E0E0E0;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .suggestion-btn:hover {
            background: #3E3E42;
            border-color: #505050;
        }

        .suggestion-btn i {
            margin-right: 8px;
            color: #007ACC;
        }
    </style>
</head>

<body>

    <!-- Left Sidebar: Files -->
    <div class="sidebar-left">
        <div class="sidebar-header">
            <span>SOURCES</span>
            <button class="add-file-btn" id="add-source-btn">
                <span>+</span> Add
            </button>
            <input type="file" id="file-input" multiple style="display: none;">
        </div>
        <div class="file-list" id="file-list">
            <!-- Files will be added here dynamically -->
            <div class="file-item active">
                <span class="file-icon">📄</span>
                <span class="file-name">Getting Started.pdf</span>
            </div>
        </div>
    </div>

    <!-- Center: Chat -->
    <div class="main-content">
        <div class="chat-container" id="chat-container">
            <div class="message ai">
                Hello! I've analyzed your files. What would you like to know?
            </div>
        </div>
        <div class="input-area">
            <textarea class="chat-input" id="chat-input" placeholder="Ask a question about your sources..."></textarea>
            <button class="send-btn" id="send-btn">➤</button>
        </div>
    </div>

    <!-- Right Sidebar: Actions -->
    <div class="sidebar-right">
        <div class="action-card">
            <div class="action-title">Suggested Actions</div>
            <button class="suggestion-btn" onclick="suggest('Summarize this document')">📝 Summarize</button>
            <button class="suggestion-btn" onclick="suggest('List key topics')">🔑 Key Topics</button>
            <button class="suggestion-btn" onclick="suggest('Create a study guide')">📚 Study Guide</button>
            <button class="suggestion-btn" onclick="suggest('Find action items')">✅ Action Items</button>
        </div>

        <div class="action-card">
            <div class="action-title">Deep Dive</div>
            <button class="suggestion-btn" onclick="suggest('Explain the methodology')">🔬 Methodology</button>
            <button class="suggestion-btn" onclick="suggest('What are the conclusions?')">💡 Conclusions</button>
        </div>
    </div>

    <script src="notebook.js"></script>
</body>

</html>
